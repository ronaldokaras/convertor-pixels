<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Forge — conversor de pixel art</title>
  <meta name="description" content="Converta imagens em pixel art com paletas clássicas. Roda 100% no navegador.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" width="18" height="18" viewBox="0 0 10 10">
      <rect x="0" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="5" y="0" width="4" height="4" fill="currentColor" opacity=".35"/>
      <rect x="0" y="5" width="4" height="4" fill="currentColor" opacity=".35"/>
      <rect x="5" y="5" width="4" height="4" fill="currentColor"/>
    </svg>
    <span>Pixel Forge</span>
    <span class="brand-sub">/ conversor</span>
  </div>
  <div class="topbar-actions">
    <span class="version">v1.4</span>
    <a href="https://github.com/seu-usuario/pixel-forge" target="_blank" rel="noopener">GitHub</a>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">

    <div class="section">
      <div class="section-title">Imagem</div>
      <button class="btn btn-block" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 11V2M4 6l4-4 4 4M2 14h12" stroke-linecap="square"/>
        </svg>
        Escolher imagem
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="presets" id="presets">
        <button class="preset" data-preset="sprite" title="Sprite de jogo (contorno fino)">Sprite</button>
        <button class="preset" data-preset="icon" title="Ícone 32×32 chapado">Ícone</button>
        <button class="preset" data-preset="retro" title="PICO-8 com dithering">Retro</button>
        <button class="preset" data-preset="gb" title="Game Boy 4 cores">GB</button>
        <button class="preset" data-preset="cartoon" title="Estilo cartoon (posterize + contorno grosso)">Cartoon</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Ajustes</div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Brilho</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Clareia ou escurece antes da pixelização. Útil pra fotos subexpostas ou superexpostas.</span>
            </span>
          </span>
          <span class="control-value" id="brightnessVal">0</span>
        </label>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Contraste</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Aumenta a separação entre tons claros e escuros. Ajuda a definição de formas antes da quantização.</span>
            </span>
          </span>
          <span class="control-value" id="contrastVal">0</span>
        </label>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Saturação</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Intensidade das cores. Valores altos realçam cores, baixos tendem ao cinza.</span>
            </span>
          </span>
          <span class="control-value" id="saturationVal">0</span>
        </label>
        <input type="range" id="saturation" min="-100" max="100" value="0">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Pixelização</div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Tamanho do pixel</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Define o tamanho de cada pixel na arte final. Valores maiores geram uma imagem mais "pixelada" e com menos detalhes.</span>
            </span>
          </span>
          <span class="control-value" id="pixelSizeVal">8</span>
        </label>
        <input type="range" id="pixelSize" min="1" max="32" value="8">
      </div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Redução</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">
                <strong>Box</strong> — média simples, geralmente o melhor resultado para pixel art.<br><br>
                <strong>Bilinear</strong> — suaviza mais (pode ficar um pouco borrado).<br><br>
                <strong>Nearest</strong> — mantém os pixels originais sem suavizar (mais "cru").
              </span>
            </span>
          </span>
        </label>
        <select id="resample">
          <option value="box">Box (recomendado)</option>
          <option value="bilinear">Bilinear</option>
          <option value="nearest">Nearest</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Estilo</div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Modo de arte</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">
                <strong>Natural</strong> — foto convertida em pixel art mantendo o degradê natural das cores.<br><br>
                <strong>2D Flat</strong> — cores chapadas + contorno fino. Ideal pra sprites de jogo.<br><br>
                <strong>2D Cartoon</strong> — posterize (menos tons) + contorno grosso. Ideal pra estilo cartoon/comic.
              </span>
            </span>
          </span>
        </label>
        <select id="style">
          <option value="natural">Natural</option>
          <option value="2d">2D Flat</option>
          <option value="cartoon">2D Cartoon</option>
        </select>
      </div>
      <div class="control" id="outlineControl" style="display:none">
        <label class="control-label">
          <span class="control-label-left">
            <span>Intensidade do contorno</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Quanto maior, mais pixels viram contorno. Valores baixos deixam só as bordas mais fortes com linha.</span>
            </span>
          </span>
          <span class="control-value" id="outlineVal">30</span>
        </label>
        <input type="range" id="outline" min="5" max="120" value="30">
        <div class="color-row">
          <span>Cor do contorno</span>
          <input type="color" id="outlineColor" value="#0f0c0a">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Cor</div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Paleta</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">
                Define quais cores a imagem final pode usar.<br><br>
                <strong>Automática</strong> extrai as cores da própria imagem.<br>
                As outras são paletas clássicas da comunidade de pixel art (PICO-8, Game Boy, Endesga, DawnBringer etc.).
              </span>
            </span>
          </span>
        </label>
        <select id="palette">
          <option value="auto">Automática (median-cut)</option>
          <option value="pico8">PICO-8</option>
          <option value="gameboy">Game Boy</option>
          <option value="sweetie16">Sweetie 16</option>
          <option value="endesga32">Endesga 32</option>
          <option value="db16">DawnBringer 16</option>
          <option value="db32">DawnBringer 32</option>
          <option value="apollo">Apollo</option>
          <option value="1bit">1-bit</option>
        </select>
      </div>
      <div class="control" id="colorCountControl">
        <label class="control-label">
          <span class="control-label-left">
            <span>Nº de cores</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Só funciona no modo Automática. Define quantas cores a ferramenta vai extrair da imagem original.</span>
            </span>
          </span>
          <span class="control-value" id="colorCountVal">16</span>
        </label>
        <input type="range" id="colorCount" min="2" max="64" value="16">
      </div>
      <label class="toggle" id="ditherToggle">
        <input type="checkbox" id="dither">
        <span class="toggle-track"></span>
        <span class="toggle-label">Dithering</span>
        <span class="info" tabindex="0">i
          <span class="info-tip">Espalha o erro de quantização para simular mais cores (Floyd-Steinberg). Bom para gradientes e suavizar bandas, mas deixa a imagem um pouco mais "ruidosa".</span>
        </span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="showGrid">
        <span class="toggle-track"></span>
        <span class="toggle-label">Mostrar grid</span>
        <span class="info" tabindex="0">i
          <span class="info-tip">Desenha a grade dos pixels por cima do preview. Útil para ver a estrutura da pixel art com precisão.</span>
        </span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Exportação</div>
      <div class="control">
        <label class="control-label">
          <span class="control-label-left">
            <span>Escala</span>
            <span class="info" tabindex="0">i
              <span class="info-tip">Multiplicador usado na hora de exportar, copiar ou compartilhar. Ex: 4× transforma cada pixel em um bloco de 4×4 pixels no PNG final.</span>
            </span>
          </span>
          <span class="control-value" id="scaleVal">4×</span>
        </label>
        <input type="range" id="scale" min="1" max="16" value="4">
      </div>
      <label class="toggle">
        <input type="checkbox" id="transparentBg">
        <span class="toggle-track"></span>
        <span class="toggle-label">Fundo transparente</span>
        <span class="info" tabindex="0">i
          <span class="info-tip">Remove pixels claros (branco/quase branco) do resultado final. Útil pra sprites que serão usados em engines/jogos.</span>
        </span>
      </label>
    </div>

  </aside>

  <section class="stage">
    <div class="stage-toolbar">
      <span class="filename" id="filename">Nenhuma imagem carregada</span>
      <span class="stats" id="stats"></span>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="empty-state" id="emptyState">
        <svg width="42" height="42" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="26" height="26"/>
          <path d="M11 3v26M21 3v26M3 11h26M3 21h26" opacity=".5"/>
        </svg>
        <div class="empty-title">Solte uma imagem aqui</div>
        <div class="empty-sub">ou clique pra escolher do seu computador</div>
        <div class="empty-formats">PNG · JPG · WEBP · GIF</div>
      </div>
      <canvas id="output"></canvas>
      <canvas id="gridOverlay"></canvas>
    </div>

    <div class="stage-footer">
      <div class="hint">
        <kbd>Espaço</kbd> comparar &nbsp;·&nbsp; <kbd>E</kbd> exportar &nbsp;·&nbsp; <kbd>R</kbd> reset
      </div>
      <div class="actions">
        <button class="btn" id="copyBtn" disabled>Copiar</button>
        <button class="btn" id="shareBtn" disabled>Compartilhar</button>
        <button class="btn" id="resetBtn" disabled>Resetar</button>
        <button class="btn btn-primary" id="exportBtn" disabled>Exportar PNG</button>
      </div>
    </div>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
